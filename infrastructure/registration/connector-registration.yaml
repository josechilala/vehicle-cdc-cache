apiVersion: batch/v1
kind: Job
metadata:
  name: connector-registration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app: connector-registration
        app.kubernetes.io/part-of: vehicle-cache
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: register
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              ready=false
              for attempt in $(seq 1 120); do
                if curl --connect-timeout 2 --max-time 5 \
                  --fail --silent --show-error \
                  http://kafka-connect:8083/connectors >/dev/null; then
                  ready=true
                  break
                fi
                sleep 3
              done
              if [ "$ready" != true ]; then
                echo "Kafka Connect REST did not become ready within 10 minutes" >&2
                exit 1
              fi
              plugins="$(curl --connect-timeout 5 --max-time 10 \
                --fail --silent --show-error \
                http://kafka-connect:8083/connector-plugins)"
              if ! printf '%s' "$plugins" |
                grep -Fq 'io.debezium.connector.postgresql.PostgresConnector'; then
                echo "Debezium PostgreSQL connector plugin is not available: $plugins" >&2
                exit 1
              fi
              sed "s/__DEBEZIUM_PASSWORD__/${DEBEZIUM_PASSWORD}/g" \
                /connector/connector.json > /tmp/connector.json
              status="$(curl --connect-timeout 5 --max-time 30 \
                --silent --show-error \
                --request PUT \
                --header 'Content-Type: application/json' \
                --output /tmp/response.json \
                --write-out '%{http_code}' \
                --data-binary @/tmp/connector.json \
                http://kafka-connect:8083/connectors/vehicle-cdc-connector/config)"
              echo "Connector REST status: $status"
              if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
                cat /tmp/response.json >&2
                exit 1
              fi
              echo "Debezium connector configuration registered"
          env:
            - name: DEBEZIUM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DEBEZIUM_PASSWORD
          volumeMounts:
            - name: connector
              mountPath: /connector
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: connector
          configMap:
            name: debezium-connector
